<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d61"><title>My Loyalty Points | Olive & Ember</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:'DM Sans',sans-serif;color:#102d61;background:#f3f6fc;font-synthesis:none;text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#102d61 0,#173e83 245px,#f3f6fc 245px)}button,input{font:inherit}.wrap{width:min(100% - 28px,500px);margin:auto;padding:28px 0 40px}.brand{color:#d8e5ff;font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}.heading{color:white;font:800 clamp(27px,7vw,35px)/1.15 Manrope,sans-serif;letter-spacing:-.045em;margin:12px 0 8px}.subheading{color:#d4e0f7;font-size:13px;line-height:1.6;margin:0 0 24px}.panel{background:#fff;border:1px solid #e1e9f7;border-radius:24px;padding:22px;box-shadow:0 16px 44px #0b245018}.label{display:block;font-size:12px;font-weight:800;margin:0 0 8px;color:#233b63}.field{display:block;width:100%;height:48px;border:1px solid #dbe5f5;border-radius:12px;background:#f9fbff;padding:0 13px;color:#102d61;outline:none;margin-bottom:15px;font-size:14px}.field:focus{border-color:#7ea6ff;box-shadow:0 0 0 4px #2868f515}.primary{width:100%;min-height:49px;border:0;border-radius:12px;background:#2868f5;color:#fff;font-size:13px;font-weight:800;box-shadow:0 6px 16px #2868f52b}.primary:disabled{opacity:.65}.privacy{font-size:11px;line-height:1.55;color:#8190a9;margin:13px 0 0}.error{margin-top:14px;border:1px solid #f1c8c8;background:#fff3f3;color:#a22b35;padding:12px;border-radius:12px;font-size:12px;line-height:1.5}.result-top{background:linear-gradient(135deg,#102d61,#2456ad);border-radius:18px;padding:20px;color:white}.result-top small{display:block;color:#c8d9ff;font-size:11px;font-weight:700;letter-spacing:.04em}.points{font:800 42px/1.15 Manrope,sans-serif;letter-spacing:-.05em;margin:8px 0}.points-caption{font-size:12px;color:#d7e4ff}.status{display:inline-flex;margin-top:14px;border-radius:99px;background:#ffffff1c;border:1px solid #ffffff30;padding:6px 10px;font-size:11px;font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.stat{padding:15px;border:1px solid #e6edf8;border-radius:14px;background:#fbfcff}.stat span{display:block;color:#8492a9;font-size:11px;margin-bottom:7px}.stat b{font:800 20px Manrope,sans-serif;color:#153563}.rule{padding:16px;border-radius:14px;background:#eff5ff;margin-top:12px}.rule h3{font-size:13px;margin:0 0 8px}.rule p{font-size:12px;color:#637795;line-height:1.6;margin:0}.secondary{margin-top:12px;background:white;border:1px solid #dce6f7;color:#23436f;border-radius:11px;min-height:42px;padding:0 14px;font-size:12px;font-weight:800}.foot{text-align:center;color:#8796ae;font-size:10px;margin-top:22px}.foot b{color:#526b91}@media(max-width:360px){.panel{padding:17px}.wrap{width:min(100% - 20px,500px)}}
</style><script src="/vendor/react.js"></script><script src="/vendor/react-dom.js"></script><script src="/vendor/htm.js"></script></head><body><div id="root"><p style="padding:24px">Loading rewards…</p></div><script>
const {useState}=React;const html=htm.bind(React.createElement);
function LoyaltyPage(){const [name,setName]=useState('');const [phone,setPhone]=useState('');const [busy,setBusy]=useState(false);const [error,setError]=useState('');const [data,setData]=useState(null);async function submit(e){e.preventDefault();setError('');setBusy(true);try{const response=await fetch('/api/customer-loyalty',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim(),phone:phone.replace(/\\D/g,'')})});const result=await response.json();if(!response.ok)throw new Error(result.error||'Could not check points.');setData(result);}catch(err){setError(err.message||'Could not check points. Please try again.');}finally{setBusy(false)}}function reset(){setData(null);setName('');setPhone('');setError('')}const reward=data?Math.floor(data.points/Math.max(1,data.rules.redeemPoints))*data.rules.redeemValue:0;return html`<main class="wrap"><div class="brand">Olive &amp; Ember · Rewards</div><h1 class="heading">Your loyalty,<br/>your rewards.</h1><p class="subheading">Check your points balance and see how close you are to your next reward.</p><section class="panel">${!data?html`<form onSubmit=${submit}><label class="label" for="customerName">Name <span style="font-weight:500;color:#8190a9">(optional)</span></label><input class="field" id="customerName" name="name" autoComplete="name" maxLength="120" placeholder="Enter your name (optional)" value=${name} onChange=${e=>setName(e.target.value)}/><label class="label" for="customerPhone">Mobile number</label><input class="field" id="customerPhone" name="phone" type="tel" inputMode="numeric" autoComplete="tel" maxLength="10" pattern="[0-9]{10}" placeholder="10-digit mobile number" required value=${phone} onChange=${e=>setPhone(e.target.value.replace(/\\D/g,'').slice(0,10))}/><button class="primary" type="submit" disabled=${busy}>${busy?'Checking your points…':'Check my points →'}</button><p class="privacy">Enter your registered mobile number to check your rewards. Adding your name is optional; if entered, it must match your customer record.</p>${error?html`<div class="error" role="alert">${error}</div>`:null}</form>`:html`<div aria-live="polite"><div class="result-top"><small>YOUR AVAILABLE BALANCE</small><div class="points">${Number(data.points).toLocaleString('en-IN')}</div><div class="points-caption">loyalty points ready to use</div><span class="status">${data.status}</span></div><div class="stats"><div class="stat"><span>Completed visits</span><b>${Number(data.visits).toLocaleString('en-IN')}</b></div><div class="stat"><span>Reward value</span><b>₹${reward.toLocaleString('en-IN')}</b></div></div><div class="rule"><h3>How your points work</h3><p>Earn ${data.rules.earning} points for every ₹${data.rules.spend} spent. Redeem ${data.rules.redeemPoints} points for ₹${data.rules.redeemValue} off your bill, subject to the restaurant’s redemption rules.</p></div><button type="button" class="secondary" onClick=${reset}>Check another account</button></div>`}</section><p class="foot">Powered by <b>Olive &amp; Ember</b> · Rewards made simple</p></main>`}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${LoyaltyPage}/>`);
</script></body></html>
