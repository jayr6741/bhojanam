window.addEventListener('error',function(e){var r=document.getElementById('root');if(r)r.innerHTML='<div style="max-width:500px;margin:32px auto;padding:24px;background:white;border-radius:16px;color:#102d61;font:14px sans-serif"><b>Rewards page could not load.</b><p>Please refresh once. If this continues, contact the restaurant.</p></div>';});
(function(){const root=document.getElementById('root');const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));root.innerHTML='<main class="wrap"><div class="brand">Olive &amp; Ember · Rewards</div><h1 class="heading">Your loyalty,<br>your rewards.</h1><p class="subheading">Check your points balance and see how close you are to your next reward.</p><section class="panel" id="loyaltyPanel"><form id="loyaltyForm"><label class="label" for="customerName">Name <span style="font-weight:500;color:#8190a9">(optional)</span></label><input class="field" id="customerName" name="name" autocomplete="name" maxlength="120" placeholder="Enter your name (optional)"><label class="label" for="customerPhone">Mobile number</label><input class="field" id="customerPhone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10" pattern="[0-9]{10}" placeholder="10-digit mobile number" required><button class="primary" id="checkPoints" type="submit">Check my points →</button><p class="privacy">Enter your registered mobile number to check your rewards. Adding your name is optional; if entered, it must match your customer record.</p><div id="loyaltyError" class="error" role="alert" hidden></div></form></section><p class="foot">Powered by <b>Olive &amp; Ember</b> · Rewards made simple</p></main>';const form=document.getElementById('loyaltyForm'),phone=document.getElementById('customerPhone'),name=document.getElementById('customerName'),btn=document.getElementById('checkPoints'),err=document.getElementById('loyaltyError');phone.addEventListener('input',()=>phone.value=phone.value.replace(/\D/g,'').slice(0,10));form.addEventListener('submit',async e=>{e.preventDefault();err.hidden=true;err.textContent='';if(!/^\d{10}$/.test(phone.value)){err.textContent='Please enter your 10-digit mobile number.';err.hidden=false;return;}btn.disabled=true;btn.textContent='Checking your points…';try{const response=await fetch('/api/customer-loyalty',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value.trim(),phone:phone.value})});const data=await response.json();if(!response.ok||data.ok===false)throw new Error(data.error||'Could not find rewards for this mobile number.');const reward=Math.floor(Number(data.points)/Math.max(1,Number(data.rules?.redeemPoints)||100))*(Number(data.rules?.redeemValue)||0);document.getElementById('loyaltyPanel').innerHTML='<div aria-live="polite"><div class="result-top"><small>YOUR AVAILABLE BALANCE</small><div class="points">'+Number(data.points||0).toLocaleString('en-IN')+'</div><div class="points-caption">loyalty points ready to use</div><span class="status">'+esc(data.status||'Active')+'</span></div><div class="stats"><div class="stat"><span>Completed visits</span><b>'+Number(data.visits||0).toLocaleString('en-IN')+'</b></div><div class="stat"><span>Reward value</span><b>₹'+reward.toLocaleString('en-IN')+'</b></div></div><div class="rule"><h3>How your points work</h3><p>Earn '+esc(data.rules?.earning??10)+' points for every ₹'+esc(data.rules?.spend??100)+' spent. Redeem '+esc(data.rules?.redeemPoints??100)+' points for ₹'+esc(data.rules?.redeemValue??50)+' off your bill, subject to the restaurant’s redemption rules.</p></div><button type="button" class="secondary" id="checkAnother">Check another account</button></div>';document.getElementById('checkAnother').addEventListener('click',()=>location.reload());}catch(error){err.textContent=error.message||'Could not check points. Please try again.';err.hidden=false;}finally{if(document.getElementById('checkPoints')){btn.disabled=false;btn.textContent='Check my points →';}}});})();
